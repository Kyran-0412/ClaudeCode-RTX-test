<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen Path Tracer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <main id="viewport">
        <canvas id="gl"></canvas>
        <canvas id="overlay"></canvas>
        <div id="hud">
          <span id="stat-samples">0 spp</span>
          <span id="stat-rate"></span>
          <span id="stat-mode" class="mode-badge" hidden></span>
        </div>
        <div id="view-modes" role="group" aria-label="Viewport shading">
          <button data-mode="wire" title="Wireframe (1)" aria-pressed="false"><span class="vm-icon vm-wire"></span>Wireframe</button>
          <button data-mode="solid" title="Solid (2)" aria-pressed="false"><span class="vm-icon vm-solid"></span>Solid</button>
          <button data-mode="render" title="Rendered (3)" aria-pressed="false"><span class="vm-icon vm-render"></span>Rendered</button>
        </div>
        <div id="hint"></div>
        <div id="toast" role="status" hidden></div>
        <div id="add-menu" role="menu" aria-label="Add object" hidden>
          <div class="menu-title">Add</div>
        </div>
        <div id="error" hidden></div>
      </main>

      <aside id="panel">
        <header class="brand">
          <div>
            <h1>Lumen</h1>
            <p>Physically based path tracer</p>
          </div>
          <select id="preset" aria-label="Load preset scene">
            <option value="">Load scene…</option>
          </select>
        </header>

        <section>
          <h2>Add</h2>
          <div class="add-grid">
            <button id="add-sphere"><span class="icon icon-sphere"></span>Sphere</button>
            <button id="add-box"><span class="icon icon-box"></span>Box</button>
            <button id="add-cylinder"><span class="icon icon-cyl"></span>Cylinder</button>
            <button id="add-light"><span class="icon icon-light"></span>Light</button>
          </div>
        </section>

        <section>
          <h2>Scene</h2>
          <ul id="entity-list"></ul>
        </section>

        <section>
          <h2>Inspector</h2>
          <div id="inspector"></div>
        </section>

        <section>
          <h2>Render</h2>
          <div id="settings"></div>
        </section>

        <section class="file-actions">
          <button id="save-png">Save image</button>
          <button id="export">Export scene</button>
          <button id="import">Import scene</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </section>
      </aside>
    </div>
    <div id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header>
          <h2 id="modal-title"></h2>
          <button id="modal-close" aria-label="Close">✕</button>
        </header>
        <p></p>
        <div class="modal-body"></div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
